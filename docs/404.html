<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priestor</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="main">
  <h1>Stránka neexistuje</h1>
  <p><a href="/">Späť na Priestor</a></p>
</main>
<script>
  // Odkazy s pozvánkou https://priestor.kvz.sk/join/KOD – ak sa neotvorila aplikácia, zobrazíme kód.
  var m = location.pathname.match(/^\/join\/([A-Za-z0-9]{4,12})\/?$/);
  if (m) {
    var code = m[1].toUpperCase();
    document.getElementById('main').innerHTML =
      '<h1>Pozvánka do Priestoru</h1>' +
      '<p class="muted">Niekto vás pozval do spoločnej oblasti v aplikácii Priestor.</p>' +
      '<div class="card"><div class="muted">Kód pozvánky</div><div class="code">' + code + '</div></div>' +
      '<ol><li>Nainštalujte si aplikáciu Priestor.</li>' +
      '<li>Prihláste sa cez Google.</li>' +
      '<li>Ťuknite na ikonu „Pripojiť sa“ hore a zadajte kód.</li></ol>' +
      '<p><a class="btn" href="https://play.google.com/store/apps/details?id=sk.kvz.priestor">Otvoriť Google Play</a></p>';
  }
</script>
</body>
</html>
