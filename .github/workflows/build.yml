name: Build

# Zostaví aplikáciu pri každom nahratí kódu.
#  - testovacie APK (na priamu inštaláciu do telefónu) – vždy
#  - podpísaný balík .aab pre Google Play – keď sú nastavené podpisové secrets
#
# Potrebné GitHub secrets (Settings → Secrets and variables → Actions):
#  GOOGLE_SERVICES_JSON     – celý obsah súboru google-services.json z Firebase
#  UPLOAD_KEYSTORE_BASE64   – (neskôr) podpisový kľúč pre Play, v base64
#  UPLOAD_KEYSTORE_PASSWORD – (neskôr) heslo ku kľúču
#  UPLOAD_KEY_ALIAS         – (neskôr) alias kľúča

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK licencie
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::Chýba google-services.json – zostavujem s náhradnou konfiguráciou, prihlásenie nebude fungovať."
            cp ci/google-services.placeholder.json app/google-services.json
          fi

      - name: Podpisový kľúč pre Play
        id: keystore
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Testovacie APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: priestor-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Testovacie APK na stiahnutie priamo v telefóne:
      # https://github.com/jurozachar-rgb/Priestor/releases/latest/download/Priestor.apk
      - name: Zverejniť testovacie APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Priestor.apk
          gh release create "test-${{ github.run_number }}" Priestor.apk \
            --title "Testovacia verzia ${{ github.run_number }}" \
            --notes "Na inštaláciu do telefónu stiahnite Priestor.apk." --latest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Balík pre Google Play (.aab)
        if: steps.keystore.outputs.path != ''
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.path != ''
        with:
          name: priestor-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
