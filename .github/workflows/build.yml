name: Build

# Zostaví aplikáciu pri každom nahratí kódu a zverejní APK ako GitHub release.
#
# GitHub secrets (Settings → Secrets and variables → Actions):
#  SIGNING_PASSWORD      – heslo k podpisovému kľúču (bez neho vznikne len testovacia debug verzia)
#  GOOGLE_SERVICES_JSON  – nepovinné, inak sa použije app/google-services.json

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK licencie
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::Chýba google-services.json – zostavujem s náhradnou konfiguráciou, prihlásenie nebude fungovať."
            cp ci/google-services.placeholder.json app/google-services.json
          fi

      # Podpisový kľúč je v repozitári zašifrovaný (AES-256). Heslo je iba v GitHub secret SIGNING_PASSWORD.
      - name: Podpisový kľúč
        id: keystore
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
              -in ci/upload-keystore.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:SIGNING_PASSWORD
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Chýba secret SIGNING_PASSWORD – zostavujem iba testovaciu (debug) verziu."
          fi

      # Ostrá verzia: nie je ladiaca (debuggable), kód je zmenšený a zatemnený (R8), podpísaná vlastným kľúčom.
      - name: Zostaviť ostrú verziu (APK + AAB pre Google Play)
        if: steps.keystore.outputs.path != ''
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: priestor
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk Priestor.apk
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Zostaviť testovaciu verziu (bez podpisového kľúča)
        if: steps.keystore.outputs.path == ''
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # assembleRelease len overí, že ostrá verzia (R8) sa dá zostaviť
          ./gradlew --no-daemon assembleDebug assembleRelease
          cp app/build/outputs/apk/debug/app-debug.apk Priestor.apk

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.path != ''
        with:
          name: priestor-play-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # APK na stiahnutie priamo v telefóne:
      # https://github.com/jurozachar-rgb/Priestor/releases/latest/download/Priestor.apk
      - name: Zverejniť APK
        run: |
          gh release create "v${{ github.run_number }}" Priestor.apk \
            --title "Priestor – verzia ${{ github.run_number }}" \
            --notes "Na inštaláciu do telefónu stiahnite Priestor.apk." --latest
        env:
          GH_TOKEN: ${{ github.token }}
