name: Test pravidiel Firestore

# Overí bezpečnostné pravidlá databázy v oficiálnom emulátore Firestore.
on:
  push:
    paths: ['firebase/**', 'firebase.json', '.github/workflows/rules.yml']
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Inštalácia
        working-directory: firebase/test
        run: npm install --no-audit --no-fund
      - name: Testy v emulátore
        run: |
          firebase/test/node_modules/.bin/firebase emulators:exec --only firestore --project demo-priestor \
            "cd firebase/test && node --test --test-concurrency=1 rules.test.mjs"
